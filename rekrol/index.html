<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ㅤ</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
  html, body {
    background:#0a0a0a; color:#fff;
    overflow:hidden; height:100vh;
  }

  .intro-line {
    position: fixed;
    top: 50%; left: 50%;
    width: 0; height: 4px;
    background: linear-gradient(90deg, #ff2d55, #ff8800, #ffea00, #00ff88, #00e5ff, #7a5cff, #ff2d55);
    background-size: 200% 100%;
    transform: translate(-50%, -50%);
    border-radius: 4px;
    box-shadow: 0 0 40px rgba(0,255,136,.9), 0 0 80px rgba(255,45,85,.6);
    z-index: 9999;
    animation: lineGrow 1.8s cubic-bezier(.7,0,.3,1) forwards,
               rainbow 2s linear infinite;
  }
  @keyframes rainbow {
    from { background-position: 0% 50%; }
    to   { background-position: 200% 50%; }
  }
  @keyframes lineGrow {
    0%   { width: 0;     height: 4px;   opacity: 0; border-radius: 4px; }
    25%  { width: 80vw;  height: 4px;   opacity: 1; border-radius: 4px; }
    55%  { width: 95vw;  height: 95vh;  opacity: 1; border-radius: 20px; }
    80%  { width: 100vw; height: 100vh; opacity: 1; border-radius: 0; }
    100% { width: 100vw; height: 100vh; opacity: 0; border-radius: 0; visibility: hidden; }
  }

  .scene {
    position: fixed; inset: 0;
    display: flex; justify-content: center; align-items: center;
    perspective: 2000px;
    opacity: 0;
    animation: sceneIn 0.3s ease 1.5s forwards;
  }
  @keyframes sceneIn {
    to { opacity: 1; }
  }

  .main-page {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 40%, #0d2a1f 0%, #0a0a0a 70%);
    overflow-y: auto;
    overflow-x: hidden;
    transform-origin: center center;
    transition: transform 1.2s cubic-bezier(.7,0,.3,1),
                opacity 1.2s ease;
    z-index: 5;
  }
  .main-page.roll-up {
    transform: scaleY(0.002) scaleX(0.95) rotateX(20deg);
    opacity: 0;
    pointer-events: none;
  }

  header {
    position: sticky; top:0; left:0; right:0;
    padding: 20px 40px;
    display:flex; justify-content: flex-end; align-items:center;
    background: rgba(10,10,10,0.85);
    backdrop-filter: blur(10px);
    z-index:100; border-bottom:1px solid #1f1f1f;
  }
  nav { display: flex; align-items: center; }
  nav a {
    color:#ccc; text-decoration:none; margin-left:35px;
    font-weight:600; font-size: 16px;
    transition: color .3s;
    cursor: pointer;
  }
  nav a:hover { color:#00ff88; }

  .hero {
    min-height: 90vh;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align:center; padding:60px 20px; position:relative;
  }
  .hero::before {
    content:''; position:absolute; inset:0;
    background:
      radial-gradient(circle at 20% 30%, rgba(0,229,255,.15), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,45,85,.15), transparent 40%);
    pointer-events:none;
  }

  .btn {
    display:inline-block; padding:18px 50px;
    background:linear-gradient(90deg,#00ff88,#00e5ff);
    color:#000; font-weight:900; font-size:18px;
    text-transform:uppercase; letter-spacing:2px;
    border:none; border-radius:50px; cursor:pointer;
    transition: transform .2s, box-shadow .3s;
    box-shadow: 0 0 30px rgba(0,255,136,.4);
    text-decoration:none;
    position: relative; z-index: 1;
  }
  .btn:hover { transform: scale(1.08); box-shadow: 0 0 50px rgba(0,255,136,.8); }

  footer { text-align:center; padding:40px 20px; color:#555; font-size:14px; background:#050505; }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    display: flex; justify-content: center; align-items: center;
    z-index: 500;
    opacity: 0; pointer-events: none;
    transition: opacity .3s ease;
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal {
    background: #111;
    border: 1px solid #1f1f1f;
    border-radius: 24px;
    padding: 50px 45px;
    max-width: 500px;
    width: 90%;
    text-align: center;
    position: relative;
    transform: scale(0.8);
    transition: transform .35s cubic-bezier(.7,0,.3,1);
    box-shadow: 0 0 60px rgba(0,255,136,.15);
  }
  .modal-overlay.show .modal { transform: scale(1); }
  .modal::before {
    content:''; position:absolute; top:0; left:30px; right:30px; height:4px;
    background:linear-gradient(90deg,#00ff88,#00e5ff,#ff2d55);
    border-radius: 0 0 4px 4px;
  }
  .modal h2 {
    font-size: 32px; font-weight: 900; margin-bottom: 20px;
    background:linear-gradient(90deg,#00ff88,#00e5ff);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .modal p { color: #bbb; font-size: 18px; line-height: 1.7; margin-bottom: 10px; }

  .empty-message {
    text-align: center;
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 900;
    letter-spacing: 2px;
    padding: 20px 0;
    background: linear-gradient(90deg, #00ff88, #00e5ff, #ff2d55);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    user-select: none;
    animation: glow 3s infinite alternate;
  }
  @keyframes glow {
    from { filter: drop-shadow(0 0 10px rgba(0,255,136,.5)); }
    to { filter: drop-shadow(0 0 30px rgba(255,45,85,.6)); }
  }

  .modal .email {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 20px;
    padding: 14px 28px;
    background: linear-gradient(90deg, #00ff88, #00e5ff);
    color: #000;
    font-weight: 900;
    font-size: 15px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    text-decoration: none;
    transition: all .3s;
    box-shadow: 0 0 25px rgba(0,255,136,.4);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .modal .email:hover {
    transform: scale(1.05);
    box-shadow: 0 0 45px rgba(0,255,136,.8);
  }
  .modal .email.copied {
    background: linear-gradient(90deg, #00e5ff, #00ff88);
    box-shadow: 0 0 60px rgba(0,255,136,1);
  }
  .modal .email-sub {
    display: block;
    margin-top: 20px;
    font-size: 14px;
    color: #888;
  }
  .modal .email-sub strong { color: #00ff88; user-select: all; }

  .modal-close {
    position: absolute; top: 15px; right: 20px;
    background: transparent; border: none;
    color: #666; font-size: 28px;
    cursor: pointer; transition: color .3s;
    line-height: 1;
  }
  .modal-close:hover { color: #ff2d55; }

  /* ========== ВИДЕО-СТРАНИЦА ========== */
  .video-page {
    position: absolute; inset: 0;
    background:#000;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    overflow:hidden;
    transform: scaleY(0.002) scaleX(0.95);
    opacity: 0;
    pointer-events: none;
    transition: transform 1.2s cubic-bezier(.7,0,.3,1),
                opacity 0.6s ease;
    z-index: 1;
  }
  .video-page.unroll {
    transform: scaleY(1) scaleX(1);
    opacity: 1;
    pointer-events: auto;
    z-index: 10;
  }
  .video-page::before {
    content:''; position:absolute; inset:0;
    background:
      radial-gradient(circle at 30% 40%, rgba(0,255,136,.2), transparent 50%),
      radial-gradient(circle at 70% 60%, rgba(255,45,85,.2), transparent 50%);
    animation: pulse 4s infinite alternate;
    pointer-events: none;
  }
  @keyframes pulse {
    from { opacity:.4; transform:scale(1); }
    to { opacity:1; transform:scale(1.2); }
  }

  .video-container {
    position:relative; z-index:1;
    text-align:center;
    padding:40px;
    max-width: 90vw;
  }

  /* 🎬 ВИДЕО-ПЛЕЕР */
  .player-wrap {
    position: relative;
    display: inline-block;
    border-radius: 20px;
    overflow: hidden;
    box-shadow:
      0 0 40px rgba(0,255,136,.5),
      0 0 80px rgba(255,45,85,.3),
      0 0 120px rgba(0,229,255,.2);
    border: 2px solid rgba(0,255,136,.4);
    background: #000;
  }
  .player-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 20px;
    pointer-events: none;
    background: linear-gradient(135deg,
      rgba(0,255,136,.1) 0%,
      transparent 50%,
      rgba(255,45,85,.1) 100%);
    z-index: 2;
  }

  #mainVideo {
    display: block;
    max-width: 80vw;
    max-height: 75vh;
    width: auto;
    height: auto;
    background: #000;
  }

  .back-btn {
    position:absolute; top:25px; left:25px; z-index:10;
    padding:10px 22px;
    background:transparent; color:#00ff88;
    border:2px solid #00ff88; border-radius:50px;
    text-decoration:none; font-weight:700; font-size:14px;
    transition: all .3s; cursor:pointer;
  }
  .back-btn:hover { background:#00ff88; color:#000; box-shadow:0 0 25px rgba(0,255,136,.7); }

  .roll-line {
    position: fixed;
    left: 50%; top: 50%;
    width: 90vw; height: 4px;
    background: linear-gradient(90deg, #00ff88, #00e5ff, #ff2d55);
    transform: translate(-50%, -50%) scaleX(0);
    transform-origin: center;
    border-radius: 4px;
    z-index: 200;
    pointer-events: none;
    box-shadow: 0 0 40px rgba(0,255,136,.9);
    transition: transform .8s cubic-bezier(.7,0,.3,1);
  }
  .roll-line.active {
    transform: translate(-50%, -50%) scaleX(1);
  }
</style>
</head>
<body>

<div class="intro-line"></div>
<div class="roll-line" id="rollLine"></div>

<div class="scene">

  <div class="main-page" id="mainPage">
    <header>
      <nav>
        <a id="featuresLink">Фишки</a>
        <a id="tariffsLink">Тарифы</a>
        <a id="aboutLink">О нас</a>
      </nav>
    </header>

    <section class="hero">
      <button class="btn" id="goBtn">Погнали 🔥</button>
    </section>

    <footer>
      © 2026 — Я ебланчик. Все права защищены.
    </footer>
  </div>

  <!-- ========= ВИДЕО ========= -->
  <div class="video-page" id="videoPage">
    <button class="back-btn" id="backBtn">← Назад</button>

    <div class="video-container">
      <div class="player-wrap">
        <video id="mainVideo" controls playsinline preload="auto">
          <source src="test.mp4" type="video/mp4">
          Твой браузер не поддерживает видео.
        </video>
      </div>
    </div>
  </div>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" id="modalClose">×</button>
    <h2 id="modalTitle">Заголовок</h2>
    <p id="modalText">Текст</p>
    <div id="modalExtra"></div>
  </div>
</div>

<script>
  const mainPage  = document.getElementById('mainPage');
  const videoPage = document.getElementById('videoPage');
  const goBtn     = document.getElementById('goBtn');
  const backBtn   = document.getElementById('backBtn');
  const rollLine  = document.getElementById('rollLine');
  const video     = document.getElementById('mainVideo');

  const modalOverlay = document.getElementById('modalOverlay');
  const modalTitle   = document.getElementById('modalTitle');
  const modalText    = document.getElementById('modalText');
  const modalExtra   = document.getElementById('modalExtra');
  const modalClose   = document.getElementById('modalClose');
  const featuresLink = document.getElementById('featuresLink');
  const tariffsLink  = document.getElementById('tariffsLink');
  const aboutLink    = document.getElementById('aboutLink');

  // ==== ФИШКИ ====
  featuresLink.addEventListener('click', () => {
    modalTitle.textContent = 'Фишки';
    modalText.innerHTML = '<div class="empty-message">Тут их нет</div>';
    modalExtra.innerHTML = '';
    modalOverlay.classList.add('show');
  });

  // ==== ТАРИФЫ ====
  tariffsLink.addEventListener('click', () => {
    modalTitle.textContent = 'Тарифы';
    modalText.innerHTML = 'Скинте 20 руб карта — 2202 2092 0978 6770';
    modalExtra.innerHTML = '';
    modalOverlay.classList.add('show');
  });

  // ==== О НАС ====
  aboutLink.addEventListener('click', () => {
    modalTitle.textContent = 'О нас';
    modalText.innerHTML = 'По вопросам пишите на почту:';
    modalExtra.innerHTML = `
      <button class="email" id="copyBtn">📋 Скопировать почту</button>
      <span class="email-sub">
        Почта: <strong>wegetebel3@gmail.com</strong>
      </span>
    `;
    modalOverlay.classList.add('show');

    document.getElementById('copyBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      const btn = e.currentTarget;
      const email = 'wegetebel3@gmail.com';

      if (navigator.clipboard) {
        navigator.clipboard.writeText(email).then(() => {
          btn.textContent = '✅ Скопировано!';
          btn.classList.add('copied');
          setTimeout(() => {
            btn.textContent = '📋 Скопировать почту';
            btn.classList.remove('copied');
          }, 2000);
        }).catch(() => fallbackCopy(email, btn));
      } else {
        fallbackCopy(email, btn);
      }
    });

    function fallbackCopy(email, btn) {
      const ta = document.createElement('textarea');
      ta.value = email;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch(err) {}
      document.body.removeChild(ta);

      btn.textContent = '✅ Скопировано!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '📋 Скопировать почту';
        btn.classList.remove('copied');
      }, 2000);
    }
  });

  modalClose.addEventListener('click', () => modalOverlay.classList.remove('show'));
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) modalOverlay.classList.remove('show');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') modalOverlay.classList.remove('show');
  });

  // ==== ПОГНАЛИ ====
  goBtn.addEventListener('click', () => {
    mainPage.classList.add('roll-up');

    setTimeout(() => {
      rollLine.classList.add('active');
    }, 900);

    setTimeout(() => {
      rollLine.classList.remove('active');
      videoPage.classList.add('unroll');

      video.currentTime = 0;
      video.play().catch(() => {});
    }, 1500);
  });

  // ==== НАЗАД ====
  backBtn.addEventListener('click', () => {
    video.pause();
    video.currentTime = 0;

    videoPage.classList.remove('unroll');
    rollLine.classList.add('active');

    setTimeout(() => {
      rollLine.classList.remove('active');
      mainPage.classList.remove('roll-up');
    }, 700);
  });

  // ==== ВИДЕО ОШИБКА ====
  video.addEventListener('error', () => {
    alert('❌ Файл test.mp4 не найден или не поддерживается.\\nПроверь, что он лежит рядом с index.html');
  });
</script>

</body>
</html>
